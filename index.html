<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helgoländer Adventskalender – Foto Dienst Helgoland</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#fff;background:linear-gradient(#00192377,#001923bb),url('helgoland-winter.jpg') center center/cover fixed}main{max-width:950px;margin:auto;padding:30px 16px 55px;text-align:center}h1{font-size:clamp(2rem,7vw,4rem);color:#ffe5a3;text-shadow:0 3px 8px #10242a;margin:15px 0}p{font-size:1.12rem;text-shadow:0 2px 4px #000}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px;margin-top:35px}.ball{border:0;background:none;color:white;position:relative;aspect-ratio:1/1.25;cursor:pointer;padding:14px 2px 0;filter:drop-shadow(0 7px 7px #0008)}.ball:before{content:'';display:block;position:absolute;top:0;left:calc(50% - 10px);width:20px;height:17px;border-radius:4px 4px 1px 1px;background:linear-gradient(90deg,#9d752d,#fff3b2,#b78c39);z-index:1}.sphere{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;font-size:clamp(1.4rem,5vw,2.6rem);font-weight:800;border:2px solid #e6c579;box-shadow:inset -15px -17px 24px #0006,inset 10px 9px 18px #fff6,0 2px 8px #0007;text-shadow:0 2px 4px #0008}.ball:nth-child(3n+1) .sphere{background:radial-gradient(circle at 30% 24%,#ffb6a2,#ba1325 44%,#56000b)}.ball:nth-child(3n+2) .sphere{background:radial-gradient(circle at 30% 24%,#fff9d0,#d7a02a 47%,#77500b)}.ball:nth-child(3n) .sphere{background:radial-gradient(circle at 30% 24%,#c1f3cf,#18754c 45%,#003923)}dialog{border:3px solid #d9ad5a;border-radius:22px;background:#11170ff5;color:white;max-width:min(90vw,470px);padding:30px 20px;text-align:center;box-shadow:0 15px 40px #0009}dialog::backdrop{background:#0009}dialog h2{color:#ffe4a0}dialog button{border:0;border-radius:12px;background:#a20b17;color:white;padding:13px 30px;font-size:1rem;font-weight:bold}footer{margin-top:25px;font-size:.9rem}@media(min-width:650px){.grid{grid-template-columns:repeat(6,1fr);gap:24px}.ball{padding-top:18px}}@media(max-width:380px){.grid{gap:10px 4px}}</style></head><body><main><div style="font-size:2rem">🎄 ⚓ 🎁</div><h1>Helgoländer Adventskalender</h1><p>Foto Dienst Helgoland · Inhaber: Nickels Krüss</p><p>Jeden Tag ein neues Türchen öffnen!</p><section class="grid" id="grid" aria-label="24 Adventstürchen"></section><footer>Alle Sonderangebote gültig bis zum 31.12.2026 · Nur solange der Vorrat reicht.</footer></main><dialog id="popup"><h2 id="heading"></h2><p id="message"></p><button id="close">Schließen</button></dialog><script>
// Die Angebote für die Tage 1–23 hier mit den bereits vereinbarten Texten und Preisen ergänzen.
// Bis zur Ergänzung wird bewusst kein möglicherweise falscher Preis angezeigt.
const angebote = {24:'Wir wünschen ein frohes Weihnachtsfest! 🎄'};
const grid=document.getElementById('grid'),popup=document.getElementById('popup');
for(let day=1;day<=24;day++){const button=document.createElement('button');button.className='ball';button.setAttribute('aria-label','Türchen '+day);button.innerHTML='<span class="sphere">'+day+'</span>';button.addEventListener('click',()=>{const now=new Date();const unlocked=now.getFullYear()>2026||(now.getFullYear()===2026&&now.getMonth()===11&&now.getDate()>=day);document.getElementById('heading').textContent=day+'. Dezember';document.getElementById('message').textContent=!unlocked?'Dieses Türchen öffnet sich erst am '+day+'. Dezember 2026.':(angebote[day]||'Das Angebot für dieses Türchen wird noch eingetragen.');popup.showModal()});grid.appendChild(button)}document.getElementById('close').onclick=()=>popup.close();
</script></body></html>
